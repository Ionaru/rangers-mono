packages:
  - packages/*
  - apps/*
saveExact: true
allowBuilds:
  # Optional native addon of ssh2 (via ts3-nodejs-library). ssh2 falls back to
  # pure JS without it, so it stays blocked: never build it.
  cpu-features: false
  # Postinstall only verifies/optimises the binary; the platform package that
  # ships it is a regular optional dependency, so esbuild works without it.
  esbuild: false
  # Builds an optional native crypto binding; ssh2 falls back to pure JS.
  ssh2: false
# Agent skills some packages offer to install for AI coding tools. Not part of
# what the code needs, so denied like the build scripts above: decided here
# once rather than left as a prompt on every install.
permissions:
  "@logtape/logtape":
    skills: false
  drizzle-kit:
    skills: false
